name: Deploy Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate PWA Assets & Inject HTML Tags
        run: |
          mkdir -p build
          cp -r index.html css js assets img static media build/ 2>/dev/null || true
          
          if [ ! -f "build/index.html" ]; then
            cp -r * build/ 2>/dev/null || true
          fi

          cat << 'EOF' > build/manifest.json
          {
            "name": "WiiDesk Web",
            "short_name": "WiiDesk",
            "description": "WiiDesk Web Preview App",
            "start_url": "./index.html",
            "display": "standalone",
            "background_color": "#ffffff",
            "theme_color": "#4a90e2",
            "icons": [
              {
                "src": "favicon.ico",
                "sizes": "64x64",
                "type": "image/x-icon"
              }
            ]
          }
          EOF

          cat << 'EOF' > build/sw.js
          const CACHE_NAME = 'wiidesk-pwa-v1';
          self.addEventListener('install', (e) => self.skipWaiting());
          self.addEventListener('activate', (e) => self.clients.claim());
          self.addEventListener('fetch', (e) => {
            e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
          });
          EOF

          if [ -f "build/index.html" ]; then
            sed -i 's/<head>/<head><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#4a90e2"><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js");});}<\/script>/g' build/index.html
          fi

          touch build/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
